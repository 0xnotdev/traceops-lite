[project]
name = "traceops-lite"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",

    # LangGraph chatbot + RAG
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.2.0",
    "faiss-cpu>=1.8.0",
    "tiktoken>=0.7.0",

    # Observability / tracing
    "arize-phoenix>=4.0.0",
    "arize-phoenix-otel>=0.3.0",
    "openinference-instrumentation-langchain>=0.1.0",
    "opentelemetry-sdk>=1.25.0",

    # Evaluation
    "deepeval>=1.0.0",

    # GitHub automation
    "PyGithub>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["traceops"]